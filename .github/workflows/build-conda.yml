name: Build Conda Package

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.11"
          channels: conda-forge,defaults

      - name: Installa conda-build
        shell: bash -el {0}
        run: conda install conda-build -y

      - name: Imposta versione
        shell: bash -el {0}
        run: echo "VERSION=$(git describe --tags --always --dirty)" >> $GITHUB_ENV

      - name: Build pacchetto conda
        shell: bash -el {0}
        run: conda build conda/ -c conda-forge -c gdefazio -c defaults --output-folder ./dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: conda-package
          path: ./dist/noarch/*.conda
          retention-days: 30

  test-install:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: conda-package
          path: ./dist

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.11"
          channels: conda-forge,defaults

      - name: Test install and CLI
        shell: bash -el {0}
        run: |
          PKG=$(find ./dist -name "*.conda" | head -n 1)
          if [ -z "$PKG" ]; then
            echo "No conda package found in artifact"
            exit 1
          fi

          # Build a local conda channel from the downloaded artifact.
          mkdir -p ./dist/noarch
          cp "$PKG" ./dist/noarch/
          conda install -y conda-build conda-index
          python -m conda_index ./dist

          conda create -n reimpact-test -y python=3.11
          conda install -n reimpact-test -y reimpact -c "$PWD/dist" -c gdefazio -c conda-forge -c defaults

          conda run -n reimpact-test reimpact-author-search --help
          conda run -n reimpact-test reimpact-impact --help